<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isla Chispa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Concepto: un mapa de cinco islas, cada isla es una materia de primero.
   Estilo calcomanía: contornos azul marino gruesos y sombras sólidas, botones enormes para dedos pequeños. */
:root{
  --bg:#e9f3ff; --ink:#1d2b5e; --ink2:#4b5a8c; --card:#ffffff;
  --sun:#ffc21a; --sky:#2f7ff0; --ok:#16a870; --no:#e8574a; --grape:#8a5cf6;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Comic Sans MS',system-ui,sans-serif;
  color-scheme:light;
  background:var(--bg);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font:400 18px/1.35 var(--body);
  padding-block:14px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.app{max-width:720px;margin:0 auto}

/* islas */
.i-letras{--c:#f0553f;--soft:#ffe4de}
.i-numeros{--c:#2f7ff0;--soft:#dcecff}
.i-mundo{--c:#14a679;--soft:#d6f5e8}
.i-corazon{--c:#e84a92;--soft:#ffe0ee}
.i-colores{--c:#7a4fe6;--soft:#ece3ff}

/* mascota */
.mas{display:block;overflow:visible}
.mas .m-cheer{display:none}
.mas[data-mood="cheer"] .m-idle{display:none}
.mas[data-mood="cheer"] .m-cheer{display:block}
.mas[data-mood="cheer"]{animation:hop .5s ease-in-out 2}
@keyframes hop{50%{transform:translateY(-12px) rotate(-6deg)}}

/* barra superior */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top .mas{width:76px;height:76px;flex:none}
.ttl{flex:1;min-width:170px}
.ttl h1{font:800 36px/1 var(--display)}
.ttl p{color:var(--ink2);font-size:17px;margin-top:5px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 14px;border:3px solid var(--ink);border-radius:999px;background:#fff;font:800 19px var(--display);box-shadow:0 3px 0 var(--ink)}
button.chip:active{transform:translateY(3px);box-shadow:none}
.star{color:var(--sun);-webkit-text-stroke:1.5px var(--ink)}
.star.off{color:#d4dcef;-webkit-text-stroke:1.5px #9aa8cc}

/* mapa */
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.isl{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;background:var(--soft);border:3px solid var(--ink);border-radius:30px 22px 34px 24px;box-shadow:0 6px 0 var(--ink);text-align:left;min-width:0}
.isl:nth-child(2){border-radius:22px 34px 24px 30px}
.isl:nth-child(3){border-radius:34px 24px 30px 22px}
.isl:nth-child(4){border-radius:24px 30px 22px 34px}
.isl:last-child{grid-column:1/-1;flex-direction:row;align-items:center;border-radius:36px 24px 36px 24px}
.isl:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.emb{width:70px;height:70px;flex:none;border-radius:50%;background:var(--c);border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font:800 30px var(--display)}
.emb .sm{font-size:24px}
.itx{min-width:0}
.itx b{display:block;font:800 25px/1.05 var(--display)}
.itx span{display:block;color:var(--ink2);font-size:15px;margin:4px 0 6px}
.itx .sc{font:800 18px var(--display);color:var(--ink)}

/* lista de juegos */
.hd{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.hd h2{font:800 30px/1.05 var(--display)}
.back{flex:none;min-height:50px;padding:0 16px;border:3px solid var(--ink);border-radius:16px;background:#fff;font:800 19px var(--display);box-shadow:0 4px 0 var(--ink)}
.back:active,.x:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.glist{display:grid;gap:14px}
.gcard{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);text-align:left}
.gcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.gem{flex:none;width:66px;height:66px;border-radius:20px;background:var(--soft);border:3px solid var(--ink);display:grid;place-items:center;font-size:36px}
.gtx{min-width:0;flex:1}
.gtx b{display:block;font:800 22px/1.1 var(--display)}
.gtx span{display:block;color:var(--ink2);font-size:15px;margin-top:3px}
.gst{font-size:26px;letter-spacing:1px;white-space:nowrap}
.gfree{font:800 16px var(--display);color:var(--ink2)}

/* pantalla de juego */
.playbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.x{flex:none;width:50px;height:50px;border-radius:50%;border:3px solid var(--ink);background:#fff;font:800 22px var(--display);box-shadow:0 3px 0 var(--ink)}
.dots{flex:1;display:flex;gap:8px;justify-content:center}
.dot{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dot.done{background:var(--ok)}
.dot.now{background:var(--sun)}
.coach{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.coach .mas{width:74px;height:74px;flex:none}
.bubble{flex:1;min-width:0;background:#fff;border:3px solid var(--ink);border-radius:24px 24px 24px 6px;padding:12px 14px;font:800 22px/1.2 var(--display);display:flex;gap:10px;align-items:center;justify-content:space-between}
.spk{flex:none;width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);display:grid;place-items:center}
.stage{background:#fff;border:3px solid var(--ink);border-radius:28px;padding:16px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;margin-bottom:18px;box-shadow:0 5px 0 var(--ink)}
.v-emo{font-size:84px;line-height:1}
.v-row{display:flex;flex-wrap:wrap;gap:4px 6px;justify-content:center;font-size:38px;line-height:1.1}
.v-sum{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;font:800 40px var(--display)}
.v-sum .grp{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:150px;font-size:30px;line-height:1.1;font-weight:400}
.v-big{font:800 50px/1.1 var(--display)}
.v-txt{font:800 26px/1.3 var(--display);text-wrap:balance}
.note{font-size:15px;color:var(--ink2);max-width:36ch}
.gone{opacity:.25;filter:grayscale(1)}
.gap{display:inline-grid;place-items:center;min-width:54px;height:54px;border:3px dashed var(--ink2);border-radius:14px;font:800 30px var(--display);color:var(--ink2);padding:0 6px}
.blocks{display:flex;gap:20px;align-items:flex-end;justify-content:center}
.tens{display:flex;gap:8px}
.ten{display:flex;flex-direction:column;gap:2px}
.ten b{width:16px;height:16px;background:var(--sky);border:2px solid var(--ink);border-radius:4px}
.ones{display:grid;grid-template-columns:repeat(3,16px);gap:2px}
.ones b{width:16px;height:16px;background:var(--sun);border:2px solid var(--ink);border-radius:4px}
.coin{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:50%;border:3px solid var(--ink);font:800 20px var(--display);background:radial-gradient(circle at 35% 30%,#fff,#b9c4d6)}
.coin.g{background:radial-gradient(circle at 35% 30%,#fff6c4,#e2a91c)}
.coins{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.swc{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);display:inline-block}
.swc.big{width:64px;height:64px}
.swc.q{display:inline-grid;place-items:center;background:#fff;border-style:dashed;font:800 28px var(--display)}

/* opciones */
.opts{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.opt{min-height:78px;padding:10px 8px;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink);min-width:0}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt:disabled{cursor:default}
.opt.bad{background:#ffe0dc;border-color:var(--no);opacity:.6;animation:shake .4s}
.opt.good{background:#c9f5e2;border-color:var(--ok)}
.opt.hint{animation:pulse .9s ease-in-out infinite}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{50%{transform:scale(1.06);background:#fff3bf}}
.opts[style*="--cols:1"] .opt{min-height:66px}
.big{font:800 38px/1 var(--display)}
.big small{font-size:26px;margin-left:6px;opacity:.7}
.txt{font:800 21px/1.2 var(--display);text-wrap:balance}
.pic{display:flex;flex-direction:column;align-items:center;gap:2px}
.oe{font-size:44px;line-height:1.1}
.ot{font:800 16px/1.1 var(--display);text-wrap:balance}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{min-width:64px;height:60px;padding:0 10px;border:3px dashed var(--ink2);border-radius:16px;display:grid;place-items:center;font:800 30px var(--display);background:#fff}
.slot.f{border-style:solid;border-color:var(--ink);background:#c9f5e2}
.tile .txt{font-size:30px}
.fb{min-height:34px;margin-top:16px;text-align:center;font:800 21px/1.25 var(--display);text-wrap:balance}
.fb.ok{color:var(--ok)}
.fb.no{color:#c2402f}

/* resultado y bienvenida */
.res,.welcome{display:grid;gap:16px;justify-items:center;text-align:center;padding-top:18px}
.bigstars{font-size:76px;letter-spacing:6px;line-height:1}
.bigstars .star{display:inline-block;animation:pop .5s backwards}
.bigstars .star:nth-child(2){animation-delay:.2s}
.bigstars .star:nth-child(3){animation-delay:.4s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.res h2,.wt{font:800 34px/1.1 var(--display);text-wrap:balance}
.res p,.ws{font-size:20px;color:var(--ink2);text-wrap:balance}
.res .mas,.welcome .mas{width:130px;height:130px}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.cta{min-height:62px;padding:0 26px;border:3px solid var(--ink);border-radius:22px;background:var(--sun);font:800 24px var(--display);box-shadow:0 5px 0 var(--ink)}
.cta.alt{background:#fff}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#name{width:100%;max-width:340px;min-height:64px;border:3px solid var(--ink);border-radius:20px;padding:0 16px;font:800 28px var(--display);text-align:center;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}

/* parejas */
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mc{aspect-ratio:1/1.05;border:3px solid var(--ink);border-radius:20px;background:var(--grape);color:#fff;font:800 40px var(--display);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:4px;min-width:0}
.mc.up{background:#fff;color:var(--ink)}
.mc.ok{background:#c9f5e2;border-color:var(--ok)}
.mem-e{font-size:48px;line-height:1}
.mem-w{font:800 22px/1.1 var(--display);overflow-wrap:anywhere}

/* simon */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;margin:0 auto}
.pad{aspect-ratio:1.2;border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);opacity:.78}
.pad.on{opacity:1;filter:brightness(1.25) saturate(1.1);transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}

/* dibujo */
.cvw{border:3px solid var(--ink);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 5px 0 var(--ink);touch-action:none}
canvas{display:block;width:100%;height:auto;touch-action:none}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink)}
.sw.sel,.tl.sel{outline:4px solid var(--sky);outline-offset:2px}
.tl{min-height:48px;min-width:48px;padding:0 14px;border-radius:14px;border:3px solid var(--ink);background:#fff;font:800 18px var(--display);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tl i{display:block;background:var(--ink);border-radius:50%}
.tl.stamp{font-size:26px}

#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
#fx i{position:absolute;top:-24px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

@media (max-width:380px){
  .ttl h1{font-size:30px}
  .bubble{font-size:19px}
  .map{gap:14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

</head>
<body>
<div class="app"><div id="view"></div></div>
<div id="fx" aria-hidden="true"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,k)=>shuffle(a).slice(0,k);
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uniq=(ans,cands,n=2,min=0)=>{const out=[];for(const c of cands){if(c!==ans&&c>=min&&!out.includes(c))out.push(c);if(out.length===n)break}let k=1;while(out.length<n){const c=ans+k*3;if(c!==ans&&!out.includes(c))out.push(c);k++}return out};

/* ---------- guardado (solo comodidad en este dispositivo) ---------- */
const KEY='islaChispa.v1';
let S={name:'',voice:true,stars:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- sonido y voz ---------- */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type,v){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);const n=a.currentTime+t0;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.18,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d+.05)}catch(e){}}
const sfx={ok(){tone(660,0,.15);tone(880,.12,.25)},no(){tone(260,0,.25,'triangle',.15)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.3))},pop(){tone(520,0,.1,'triangle')}};
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/es[-_]MX/i.test(v.lang))||vs.find(v=>/es[-_]US/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){if(!S.voice||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:'es-MX';if(voice)u.voice=voice;u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}

/* ---------- piezas visuales ---------- */
const MAS=()=>`<svg class="mas" viewBox="0 0 100 100" data-mood="idle" aria-hidden="true"><path d="M50 8L61 34L90 37L68 56L75 85L50 70L25 85L32 56L10 37L39 34Z" fill="#ffc21a" stroke="#1d2b5e" stroke-width="5" stroke-linejoin="round"/><circle cx="40" cy="50" r="4.5" fill="#1d2b5e"/><circle cx="60" cy="50" r="4.5" fill="#1d2b5e"/><circle cx="33" cy="58" r="4" fill="#ff7fa3" opacity=".85"/><circle cx="67" cy="58" r="4" fill="#ff7fa3" opacity=".85"/><path class="m-idle" d="M42 60Q50 68 58 60" fill="none" stroke="#1d2b5e" stroke-width="3.5" stroke-linecap="round"/><path class="m-cheer" d="M40 58Q50 78 60 58Z" fill="#1d2b5e" stroke="#1d2b5e" stroke-width="2" stroke-linejoin="round"/></svg>`;
const SPK=`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1d2b5e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#1d2b5e"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
function mood(m){document.querySelectorAll('.mas').forEach(s=>{s.dataset.mood=m;if(m!=='idle')setTimeout(()=>{s.dataset.mood='idle'},1100)})}
const stars=(n,max=3)=>Array.from({length:max},(_,i)=>`<span class="star${i<n?'':' off'}">★</span>`).join('');
const view=h=>{$('#view').innerHTML=h;try{window.scrollTo(0,0)}catch(e){}};
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const fx=$('#fx');const cols=['#f0553f','#2f7ff0','#14a679','#e84a92','#ffc21a','#8a5cf6'];for(let i=0;i<48;i++){const s=document.createElement('i');s.style.cssText=`left:${rnd(100)}%;background:${pick(cols)};animation-delay:${Math.random()*.6}s;animation-duration:${1.8+Math.random()*1.4}s`;fx.appendChild(s)}setTimeout(()=>{fx.innerHTML=''},3800)}

/* ---------- constructores de preguntas ---------- */
const Q=(say,vis,right,wrong,o)=>Object.assign({say,vis,opts:shuffle([{h:right,ok:1},...wrong.map(h=>({h}))])},o||{});
const nO=n=>`<span class="big">${n}</span>`;
const tO=t=>`<span class="txt">${t}</span>`;
const pO=(e,t)=>`<span class="pic"><span class="oe">${e}</span><span class="ot">${t}</span></span>`;
const eO=e=>`<span class="oe">${e}</span>`;
const rep=(e,n,c)=>Array.from({length:n},()=>`<span class="${c||''}">${e}</span>`).join('');
const FOOD=['🍎','🐟','⭐','🌸','🐞','🎈','🍓','🐥'];

/* ====================== ISLA LETRAS ====================== */
const FL=[['🐱','gato','G'],['🌞','sol','S'],['🌙','luna','L'],['🦆','pato','P'],['🐻','oso','O'],['🍇','uva','U'],['✈️','avión','A'],['🐘','elefante','E'],['🦷','diente','D'],['🐸','rana','R'],['🍅','tomate','T'],['🐮','vaca','V'],['👞','zapato','Z'],['🍎','manzana','M'],['🦒','jirafa','J'],['☁️','nube','N'],['🌸','flor','F'],['🐳','ballena','B'],['🏠','casa','C']];
const genFirst=()=>sample(FL,6).map(([e,w,L])=>{
  const lo=l=>`<span class="big">${l}<small>${l.toLowerCase()}</small></span>`;
  const wr=sample(FL.map(x=>x[2]).filter(x=>x!==L),2);

function startGame(g){
  LAST=g;
  if(g.type==='memory')return viewMemory(g);
  if(g.type==='draw')return viewDraw(g);
  if(g.type==='simon')return viewSimon(g);
  G={g,qs:g.gen(),i:0,score:0,tries:0,pos:0,locked:false};
  viewQ();
}
function viewQ(){
  const q=G.qs[G.i];G.tries=0;G.locked=false;G.pos=0;
  const dots=G.qs.map((_,i)=>`<span class="dot ${i<G.i?'done':i===G.i?'now':''}"></span>`).join('');
  let vis=q.vis,body;
  if(q.type==='build'){
    vis+=`<div class="slots">${q.syl.map(()=>'<span class="slot"></span>').join('')}</div>`;
    body=`<div class="opts" style="--cols:${Math.min(q.syl.length,4)}">${shuffle(q.syl.map((s,i)=>({s,i}))).map(t=>`<button class="opt tile" data-act="tile" data-s="${esc(t.s)}"><span class="txt">${t.s}</span></button>`).join('')}</div>`;
  }else{
    body=`<div class="opts" style="--cols:${q.cols||3}">${q.opts.map((o,i)=>`<button class="opt" data-act="opt" data-i="${i}">${o.h}</button>`).join('')}</div>`;
  }
  view(`<section class="${ISL[G.g.isl].cls}">${bar(dots)}<div class="coach">${MAS()}<div class="bubble"><span>${esc(q.p||q.say)}</span><button class="spk" data-act="say" aria-label="Escuchar la pregunta">${SPK}</button></div></div><div class="stage">${vis}${q.note?`<p class="note">${q.note}</p>`:''}</div>${body}<p class="fb" id="fb" role="status" aria-live="polite"></p></section>`);
  const g=G;setTimeout(()=>{if(G===g)say(q.say)},300);
}
function fb(msg,cls){const el=$('#fb');if(el){el.textContent=msg;el.className='fb '+(cls||'')}}
function good(q){
  G.locked=true;if(G.tries===0)G.score++;sfx.ok();mood('cheer');
  const p=pick(PRAISE);fb(`${p} ${q.fb||''}`,'ok');say(p+' '+(q.sayDone||q.fb||''));
  const g=G;setTimeout(()=>{if(G===g)next()},q.type==='build'?2200:2000);
}
function wrong(q,hintSel){
  G.tries++;sfx.no();fb(q.hint||'¡Casi! Inténtalo otra vez.','no');
  if(G.tries>=2)hintSel();
}
function choose(t){
  if(!G||G.locked)return;const q=G.qs[G.i],i=+t.dataset.i;
  if(q.opts[i].ok){t.classList.add('good');document.querySelectorAll('.opt').forEach(b=>{b.disabled=true});good(q)}
  else{t.classList.add('bad');t.disabled=true;wrong(q,()=>{document.querySelectorAll('.opt').forEach((b,n)=>{if(q.opts[n].ok)b.classList.add('hint')})})}
}
function tile(t){
  if(!G||G.locked)return;const q=G.qs[G.i];
  if(t.dataset.s===q.syl[G.pos]){
    const slot=document.querySelectorAll('.slot')[G.pos];slot.textContent=t.dataset.s;slot.classList.add('f');
    t.disabled=true;t.style.visibility='hidden';G.pos++;sfx.pop();
    document.querySelectorAll('.tile.hint').forEach(b=>b.classList.remove('hint'));
    if(G.pos===q.syl.length)good(q);
  }else{
    t.classList.add('bad');setTimeout(()=>t.classList.remove('bad'),450);
    wrong(q,()=>{const b=[...document.querySelectorAll('.tile')].find(x=>!x.disabled&&x.dataset.s===q.syl[G.pos]);if(b)b.classList.add('hint')});
  }
}
function next(){G.i++;if(G.i>=G.qs.length)return finishRound();viewQ()}
function finishRound(){const sc=G.score,st=sc>=5?3:sc>=3?2:1;finish(G.g,st,`Acertaste ${sc} de ${G.qs.length} a la primera.`)}
function finish(g,st,line){
  S.stars[g.id]=Math.max(S.stars[g.id]||0,st);save();sfx.win();if(st>=2)confetti();
  const nm=S.name?`, ${esc(S.name)}`:'';
  const msg=st===3?`¡Increíble${nm}!`:st===2?`¡Muy bien${nm}!`:`¡Buen intento${nm}!`;
  view(`<div class="res ${ISL[g.isl].cls}">${MAS()}<div class="bigstars">${stars(st)}</div><h2>${msg}</h2><p>${line}${st<3?' Juega otra vez para ganar más estrellas.':''}</p><div class="btns"><button class="cta" data-act="again">Jugar otra vez</button><button class="cta alt" data-act="quit">Más juegos</button></div></div>`);
  mood('cheer');say(msg.replace(/<[^>]*>/g,'')+' Ganaste '+st+(st===1?' estrella.':' estrellas.'));
}

  setTimeout(()=>say('Busca cada dibujo y su palabra.'),300);

function memTap(t){
  const M=MEM;if(!M||M.lock)return;const n=+t.dataset.n,c=M.cards[n];
  if(M.open.includes(n)||t.classList.contains('ok'))return;
  t.innerHTML=c.h;t.classList.add('up');M.open.push(n);sfx.pop();if(c.word)say(c.w);
  if(M.open.length<2)return;
  M.moves++;const [a,b]=M.open.map(i=>M.cards[i]);const els=[...document.querySelectorAll('.mc')];
  if(a.id===b.id&&a.word!==b.word){
    M.open.forEach(i=>els[i].classList.add('ok'));M.open=[];M.found++;sfx.ok();mood('cheer');fb(`¡Pareja! ${cap(a.w)}.`,'ok');
    if(M.found===6){const mv=M.moves,st=mv<=9?3:mv<=14?2:1;setTimeout(()=>{if(MEM===M)finish(M.g,st,`Lo lograste en ${mv} intentos.`)},1400)}
  }else{
    M.lock=true;sfx.no();fb('Casi. ¡Busca otra vez!','no');
    setTimeout(()=>{if(MEM!==M)return;M.open.forEach(i=>{els[i].classList.remove('up');els[i].textContent='?'});M.open=[];M.lock=false;fb('')},1100);
  }
}

/* ----- simón músico ----- */
let SM=null;
const PADC=['#ff5c5c','#ffc21a','#2ec27e','#2f93ff'],PADN=[262,330,392,523];
function viewSimon(g){
  const lens=[2,3,3,4,4,5];
  SM={g,r:0,score:0,seq:[],pos:0,accept:false,tries:0};
  const M=SM;
  const dots=()=>lens.map((_,i)=>`<span class="dot ${i<M.r?'done':i===M.r?'now':''}"></span>`).join('');
  view(`<section class="${ISL[g.isl].cls}" id="simon">${bar(dots())}<div class="coach">${MAS()}<div class="bubble"><span id="sstat">Escucha con atención…</span></div></div><div class="pads">${PADC.map((c,i)=>`<button class="pad" data-act="pad" data-p="${i}" style="background:${c}" aria-label="Tecla ${i+1}"></button>`).join('')}</div></section>`);
  const live=()=>SM===M&&$('#simon');
  const later=(f,ms)=>setTimeout(()=>{if(live())f()},ms);
  const stat=t=>{const e=$('#sstat');if(e)e.textContent=t};
  const flash=p=>{const b=document.querySelectorAll('.pad')[p];if(!b)return;b.classList.add('on');tone(PADN[p],0,.45,'triangle',.22);setTimeout(()=>b.classList.remove('on'),420)};
  M.flash=flash;
  M.play=()=>{M.accept=false;stat('Escucha con atención…');M.seq.forEach((p,i)=>later(()=>flash(p),800+i*750));later(()=>{M.accept=true;M.pos=0;stat('¡Ahora tú!')},800+M.seq.length*750)};
  M.begin=()=>{M.seq=Array.from({length:lens[M.r]},()=>rnd(4));M.tries=0;M.play()};
  M.tap=p=>{
    if(!M.accept)return;flash(p);
    if(p===M.seq[M.pos]){
      M.pos++;
      if(M.pos===M.seq.length){
        M.accept=false;if(M.tries===0)M.score++;M.r++;sfx.ok();mood('cheer');stat('¡Muy bien!');
        const d=document.querySelector('.dots');if(d)d.innerHTML=dots();
        if(M.r>=lens.length)later(()=>{const sc=M.score;finish(M.g,sc>=5?3:sc>=3?2:1,`Repetiste ${sc} de ${lens.length} a la primera.`)},1100);
        else later(M.begin,1300);
      }
    }else{M.accept=false;M.tries++;sfx.no();stat('Casi. Escucha otra vez…');later(M.play,1200)}
  };
  later(M.begin,500);
}

/* ----- taller de dibujo ----- */
let DR=null;
function viewDraw(g){
  DR={color:'#1d2b5e',size:10,stamp:null,hist:[],drawing:false,sure:false};
  const cols=['#1d2b5e','#ee2f3f','#ff8a1f','#ffd21a','#25b868','#2f93ff','#8a4de0','#ff8fc0','#8b5a2b','#ffffff'];
  const stamps=['⭐','❤️','🌈','🦋','🌸','🐱'];
  view(`<section class="${ISL[g.isl].cls}">${bar('')}<div class="cvw"><canvas id="cv" width="800" height="560" aria-label="Hoja para dibujar"></canvas></div>
  <div class="pal" id="pcol">${cols.map((c,i)=>`<button class="sw${i===0?' sel':''}" data-act="color" data-c="${c}" style="background:${c}" aria-label="Color ${i+1}"></button>`).join('')}</div>
  <div class="pal" id="psz">${[[6,'Fino'],[10,'Medio'],[28,'Grueso']].map(([s,l],i)=>`<button class="tl${i===1?' sel':''}" data-act="size" data-s="${s}" aria-label="Pincel ${l}"><i style="width:${Math.max(8,Math.min(s,26))}px;height:${Math.max(8,Math.min(s,26))}px"></i></button>`).join('')}${stamps.map(s=>`<button class="tl stamp" data-act="stamp" data-s="${s}" aria-label="Sello ${s}">${s}</button>`).join('')}</div>
  <div class="pal"><button class="tl" data-act="undo">Deshacer</button><button class="tl" data-act="clear" id="clr">Borrar todo</button></div></section>`);
  const cv=$('#cv'),cx=cv.getContext('2d');DR.cx=cx;
  cx.fillStyle='#fff';cx.fillRect(0,0,800,560);cx.lineCap='round';cx.lineJoin='round';
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*560/r.height]};
  cv.onpointerdown=e=>{
    e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
    ac();snap();const [x,y]=pos(e);
    if(DR.stamp){cx.font='96px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='#000';cx.fillText(DR.stamp,x,y);sfx.pop();return}
    DR.drawing=true;cx.strokeStyle=DR.color;cx.lineWidth=DR.size;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.01,y);cx.stroke();
  };
  cv.onpointermove=e=>{if(!DR.drawing)return;e.preventDefault();const [x,y]=pos(e);cx.lineTo(x,y);cx.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{DR.drawing=false};
}
function snap(){if(!DR)return;DR.hist.push(DR.cx.getImageData(0,0,800,560));if(DR.hist.length>8)DR.hist.shift()}
function sel(box,el){document.querySelectorAll(box+' .sel').forEach(b=>b.classList.remove('sel'));if(el)el.classList.add('sel')}

/* ====================== EVENTOS ====================== */
const ACT={
  start,
  home:viewHome,
  hi(){mood('cheer');say(S.name?`¡Hola, ${S.name}! ¡Vamos a jugar!`:'¡Hola! ¡Vamos a jugar!')},
  island(t){sfx.pop();viewIsland(t.dataset.id)},
  game(t){startGame(GAMES.find(x=>x.id===t.dataset.id))},
  quit,
  opt:choose,
  tile,
  say(){if(G&&G.qs[G.i])say(G.qs[G.i].say)},
  again(){if(LAST)startGame(LAST)},
  voice(t){S.voice=!S.voice;save();if(!S.voice){try{speechSynthesis.cancel()}catch(e){}}document.querySelectorAll('[data-act="voice"]').forEach(b=>{b.textContent=voiceLbl()})},
  rename:viewWelcome,
  mc:memTap,
  pad(t){if(SM&&SM.tap)SM.tap(+t.dataset.p)},
  color(t){if(!DR)return;DR.color=t.dataset.c;DR.stamp=null;sel('#pcol',t);sel('#psz',null);const s=document.querySelector('#psz .tl:not(.stamp)[data-s="'+DR.size+'"]');if(s)s.classList.add('sel')},
  size(t){if(!DR)return;DR.size=+t.dataset.s;DR.stamp=null;sel('#psz',t)},
  stamp(t){if(!DR)return;DR.stamp=t.dataset.s;sel('#psz',t)},
  undo(){if(!DR||!DR.hist.length)return;DR.cx.putImageData(DR.hist.pop(),0,0)},
  clear(t){
    if(!DR)return;
    if(!DR.sure){DR.sure=true;t.textContent='¿Seguro? Toca otra vez';setTimeout(()=>{if(DR){DR.sure=false;t.textContent='Borrar todo'}},2500);return}
    snap();DR.cx.fillStyle='#fff';DR.cx.fillRect(0,0,800,560);DR.sure=false;t.textContent='Borrar todo';
  }
};
$('#view').addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;ac();const f=ACT[t.dataset.act];if(f)f(t)});

if(S.name)viewHome();else viewWelcome();
})();
</script>
